# Intended contents of /etc/wsl.conf.
#
# This is the closest thing WSL2 has to the video's macOS `system.defaults`
# block: host-level settings that shape the machine rather than the user
# environment. /etc/wsl.conf is root-owned, so Home Manager cannot write it;
# bootstrap.sh diffs this file against the live one and offers to install it
# with sudo.
#
# Changes here need `wsl --shutdown` from Windows to take effect.

[boot]
systemd = true

[user]
default = mindcriminal

[interop]
# Keep Windows interop on: the WezTerm loader, wslpath and clipboard sharing
# all depend on it.
enabled = true
# Keep the Windows PATH appended. It is long and noisy, but dropping it breaks
# cmd.exe/powershell.exe lookups that scripts here rely on.
appendWindowsPath = true

[automount]
enabled = true
options = "metadata,umask=22,fmask=11"
